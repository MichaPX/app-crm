<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kiosk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Kiosk</title>
<style>
:root{--accent:#FF7A45;--bg:#121214;--surf:#1C1C20;--surf2:#232328;--line:#2A2A31;--muted:#A3A3AD;--muted2:#8A8A95;--text:#F3F2EF}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#E7E5E0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:#1B1B1D;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.stage{display:flex;height:100vh;align-items:center;justify-content:center;gap:44px;padding:24px}
.phone{flex:0 0 auto;width:414px;height:868px;border-radius:58px;background:#0A0A0B;padding:12px;box-shadow:0 40px 90px rgba(0,0,0,.28),inset 0 0 0 2px #2C2C30}
.screen{position:relative;width:390px;height:844px;border-radius:46px;overflow:hidden;background:var(--bg);color:var(--text)}
#app{position:absolute;inset:0}
.phone.ipad{width:844px;height:1204px;border-radius:44px;padding:12px}
.phone.ipad .screen{width:820px;height:1180px;border-radius:32px}
.devsw{display:flex;gap:3px;padding:3px;border-radius:10px;background:#EFEDE8;margin:12px 0 2px}
.devsw button{flex:1;height:30px;border-radius:8px;border:0;background:none;font:inherit;font-size:13px;font-weight:650;color:#6B6B73;cursor:pointer}
.devsw button.on{background:#fff;color:#1B1B1D;box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* ---------- iPad ---------- */
.tablet .hdr{padding-left:24px;padding-right:24px}
.tablet .chips,.tablet .cats{padding-left:24px;padding-right:24px}
.tablet .banner{margin:10px 24px 0}
.tablet .bslides,.tablet .banner .adslot,.tablet .banner .adimg{height:auto;aspect-ratio:var(--bar,3);max-height:var(--bmax,420px)}
.tablet .kscroll{gap:28px;padding:18px 0}
.tablet .info{max-width:620px;margin:0 auto;width:100%}
.tablet .info h2{font-size:34px}
.tablet .native{max-width:760px;margin:32px auto}
.tablet .gridwrap{padding:24px 24px 0}
.tablet .grid3{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 20px}
.tablet .grid2{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:30px 20px;padding:20px 24px 32px}
.tablet.land #kbody.kswipe{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);align-items:center;padding-right:28px}
.tablet.land #kbody.kswipe .info{max-width:440px;margin:0;align-items:flex-start;text-align:left;padding:0}
.tablet.land #kbody.kswipe .info h2{font-size:36px}
.tablet .cta{width:auto;justify-content:center}
.tablet .cta .pbtn,.tablet .cta .sbtn{flex:0 0 auto;min-width:150px;padding:0 28px}
.tablet.land #kbody.kswipe .cta{justify-content:flex-start}
.tablet .npanel{left:auto;right:16px;width:min(520px,calc(100% - 32px))}
.tablet .sheet{left:calc(50% - 300px);right:calc(50% - 300px);bottom:20px;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.panel{flex:0 0 400px;width:400px;align-self:stretch;max-height:calc(100vh - 48px);overflow-y:auto;background:#FFFFFF;border-radius:22px;box-shadow:0 12px 40px rgba(0,0,0,.08);padding:26px 24px}
@media (max-width:920px){body{overflow:auto}.stage{flex-direction:column;height:auto}.panel{flex:none;max-height:none;width:100%;max-width:440px}}

/* ---------- App ---------- */
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.bare{appearance:none;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
.btn{appearance:none;border:0;cursor:pointer}
.bare:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.page{position:absolute;left:0;top:0;right:0;bottom:54px;overflow-y:auto;overflow-x:hidden}
.hdr{display:flex;align-items:center;gap:12px;padding:14px 16px 6px}
.hdr h1{margin:0;font-size:28px;font-weight:750;letter-spacing:-.02em;line-height:1.1}
.sub{font-size:13px;color:var(--muted)}
.roundbtn{position:relative;width:44px;height:44px;flex:0 0 44px;border-radius:22px;background:var(--chip);color:var(--text);display:flex;align-items:center;justify-content:center}
.dotmark{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:4px;background:var(--accent);box-shadow:0 0 0 2px var(--chip)}
.adlabel{font-size:10px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.adslot{border:1px dashed var(--dim);background:repeating-linear-gradient(135deg,var(--stripe1) 0 10px,var(--stripe2) 10px 20px)}
.banner{margin:8px 16px 0;display:flex;flex-direction:column;gap:4px}
.bslides{position:relative;height:var(--bh,120px);border-radius:12px;overflow:hidden;background:var(--chip)}
.btrack{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.btrack::-webkit-scrollbar{display:none}
.bslide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;padding:0;border:0;background:none;cursor:pointer;display:block}
.bslide img,.bslide video{display:block;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}
.bdots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.bdots span{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.15);transition:width .25s,background .25s}
.bdots span.on{width:16px;background:#fff}
.slist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.sitem{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid #E4E2DC;border-radius:10px;background:#FAFAF8}
.sitem .sth{flex:0 0 96px;width:96px;height:54px;border-radius:6px;overflow:hidden;background:#E9E7E1;position:relative}
.sitem .sth img,.sitem .sth video{width:100%;height:100%;object-fit:cover;display:block}
.sitem .sth .vt{position:absolute;left:4px;bottom:4px;font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.65);color:#fff}
.sitem .sf{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sitem .sf input{height:32px;font-size:12.5px}
.sitem .sb{display:flex;flex-direction:column;gap:4px}
.sitem .sb button{height:26px;min-width:30px;padding:0 8px;font-size:12px}
.banner .adslot{height:var(--bh,120px);border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--text2)}
.chips{display:flex;gap:8px;overflow-x:auto;align-items:center;padding:12px 16px 4px}
.btile{flex:0 0 auto;height:40px;padding:0 4px;border-radius:0;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:none;box-shadow:none;opacity:.45;filter:saturate(.7);transition:opacity .2s,filter .2s,transform .2s}
.btile::after{content:"";position:absolute;left:50%;bottom:-3px;width:0;height:3px;border-radius:2px;background:var(--accent);transform:translateX(-50%);transition:width .25s}
.btile.on::after{width:22px}
.btile img{display:block;height:30px;max-width:140px;object-fit:contain;border-radius:3px}
.btile:hover{opacity:.8;filter:none}
.btile.on{opacity:1;filter:none}
.btile:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.chipprev .btile{opacity:1;filter:none}
.chip{flex:0 0 auto;height:36px;padding:0 14px;border-radius:18px;background:var(--chip);color:var(--text2);font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.chip.on{background:var(--text);color:var(--bg)}
.chip i{width:10px;height:10px;border-radius:5px;display:block}
.bar{position:relative;margin:10px 16px 0;display:flex;gap:8px;align-items:center}
.wbtn{position:relative;width:36px;height:36px;flex:0 0 36px;border-radius:18px;background:var(--chip);display:flex;align-items:center;justify-content:center;padding:0}
.wbtn svg{width:30px;height:30px;display:block}
.wbtn .ping{position:absolute;top:1px;right:1px;width:9px;height:9px;border-radius:5px;background:var(--accent);box-shadow:0 0 0 2px var(--bg);animation:ping 2.4s ease-in-out infinite}
.wbtn.open{background:var(--pill)}
@keyframes ping{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.35)}}
.wscrim{position:fixed;inset:0;z-index:27;background:transparent;border:0;cursor:default}
.wbub{position:absolute;top:50px;left:0;right:0;z-index:28;background:var(--surf);color:var(--text);border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 50px rgba(0,0,0,.4);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;transform-origin:var(--tx,90px) -10px}
.wbub.pop{animation:wpop .34s cubic-bezier(.2,1.3,.4,1)}
@keyframes wpop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.wbub::before{content:"";position:absolute;top:-8px;left:calc(var(--tx,90px) - 8px);width:16px;height:16px;background:var(--surf);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);border-radius:3px 0 0 0}
.wolly{position:absolute;right:14px;top:-78px;width:76px;height:92px;pointer-events:none;z-index:2}
.wbub.pop .wolly{animation:wdrop .6s cubic-bezier(.3,1.5,.5,1) .1s both}
@keyframes wdrop{from{transform:translateY(-24px) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.wolly .arm{transform-origin:58px 60px;animation:wave 1.6s ease-in-out .5s 2}
@keyframes wave{0%,100%{transform:rotate(0)}25%{transform:rotate(-28deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-22deg)}}
.wolly .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.wolly .ant{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.45}}
.whead{display:flex;align-items:center;gap:8px;padding-right:86px}
.whead b{font-size:15px}
.whead small{font-size:12px;color:var(--muted)}
.wclose{margin-left:auto;width:32px;height:32px;border-radius:16px;background:var(--chip2);color:var(--text);display:flex;align-items:center;justify-content:center;position:relative;z-index:3}
.wmsgs{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto;padding:2px}
.wm{max-width:86%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-line}
.wm.bot{align-self:flex-start;background:var(--chip2);border-top-left-radius:4px}
.wm.me{align-self:flex-end;background:var(--accent);color:var(--onaccent);border-top-right-radius:4px}
.wm.typing{display:flex;gap:4px;padding:12px 14px}
.wm.typing i{width:7px;height:7px;border-radius:4px;background:var(--muted);animation:dots 1s infinite}
.wm.typing i:nth-child(2){animation-delay:.15s}.wm.typing i:nth-child(3){animation-delay:.3s}
@keyframes dots{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.wacts{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:92%}
.wact{height:32px;padding:0 12px;border-radius:16px;background:transparent;border:1.5px solid var(--accent);color:var(--accent);font-size:13px;font-weight:650}
.wquick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.wq{flex:0 0 auto;height:32px;padding:0 12px;border-radius:16px;background:var(--chip);color:var(--text2);font-size:13px;font-weight:600;white-space:nowrap}
.wform{display:flex;gap:8px}
.wform input{flex:1;min-width:0;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--surf2);color:var(--text);font:inherit;font-size:14px;padding:0 14px;outline-color:var(--accent)}
.wsend{width:42px;height:42px;flex:0 0 42px;border-radius:21px;background:var(--accent);color:var(--onaccent);display:flex;align-items:center;justify-content:center}
.seg{flex:1;position:relative;display:flex;padding:3px;border-radius:11px;background:var(--chip)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:8px;background:var(--pill);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.seg button{position:relative;flex:1;text-align:center;height:30px;font-size:13px;font-weight:700;color:var(--muted);transition:color .2s}
.seg button.on{color:var(--text)}
.ywrap{position:relative}
.ybtn{height:36px;padding:0 14px;border-radius:11px;background:var(--chip);display:flex;align-items:center;gap:8px;color:var(--text)}
.ybtn .ylab{font-size:12px;color:var(--muted)}
.ybtn b{font-size:15px;font-weight:750}
.ybtn svg{color:var(--muted);transition:transform .2s}
.ybtn.open svg{transform:rotate(180deg)}
.ybtn.static{cursor:default}
.ybtn.open{background:var(--pill)}
.yscrim{position:fixed;inset:0;z-index:25;background:transparent;border:0;cursor:default}
.ypop{position:absolute;top:42px;left:0;z-index:26;min-width:210px;padding:6px;border-radius:14px;background:var(--surf);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.35);animation:dropin .18s cubic-bezier(.2,.8,.2,1);transform-origin:top left}
.yopt{display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;border-radius:9px}
.yopt:hover{background:var(--chip)}
.yopt b{font-size:16px;font-weight:750;min-width:48px}
.yopt span{flex:1;font-size:13px;color:var(--muted)}
.yopt svg,.yopt i{width:18px;height:18px;color:var(--accent);display:block}
.yopt.on b{color:var(--accent)}
.views{display:flex;padding:3px;gap:2px;border-radius:11px;background:var(--chip)}
.views button{width:34px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.views button.on{background:var(--pill);color:var(--text)}
#kbody{transition:opacity .17s ease,transform .17s ease}
#kbody.out{opacity:0;transform:translateY(10px)}
#kbody.in{animation:kin .25s ease}
@keyframes kin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kscroll{display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;padding:12px 0 12px;user-select:none;-webkit-user-select:none;cursor:grab}
.kscroll.drag{scroll-snap-type:none;cursor:grabbing}
.kscroll .spacer{flex:0 0 94px}
.card{flex:0 0 var(--cw,170px);height:var(--ch,241px);scroll-snap-align:center;border-radius:6px;overflow:hidden;box-shadow:0 20px 44px rgba(0,0,0,.55);background:var(--chip);padding:0;border:0;will-change:transform}
.card img,.gcover img,.lcover img,.scover img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;padding:0 24px}
.dots button{width:18px;height:16px;display:flex;align-items:center;justify-content:center}
.dots span{display:block;height:6px;width:6px;border-radius:3px;background:var(--dim);transition:width .25s,background .25s}
.dots .on span{width:18px;background:var(--accent)}
.info{padding:4px 24px 0;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.kick{font-size:11px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.info h2{margin:0;font-size:26px;line-height:1.05;font-weight:750;letter-spacing:-.02em}
.info p{margin:0;font-size:14px;color:var(--text2)}
.cta{display:flex;gap:10px;margin-top:8px;width:100%}
.pbtn{flex:1.3;height:46px;border-radius:23px;background:var(--accent);color:var(--onaccent);font-size:15px;font-weight:750}
.sbtn{flex:1;height:46px;border-radius:23px;background:var(--chip2);color:var(--text);font-size:15px;font-weight:600}
.native{margin:28px 16px 28px;display:flex;flex-direction:column;gap:4px}
.native .adslot{height:96px;border-radius:12px;display:flex;align-items:center;gap:14px;padding:0 14px}
.native .img{flex:0 0 68px;height:68px;border-radius:8px;background:var(--chip2);display:flex;align-items:center;justify-content:center;color:var(--muted2)}
.gridwrap{padding:22px 16px 0;display:flex;flex-direction:column;gap:14px}
.ghead{display:flex;align-items:baseline;justify-content:space-between}
.ghead h2{margin:0;font-size:18px;font-weight:750}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}
.gitem{display:flex;flex-direction:column;gap:6px}
.gcover{width:111px;height:157px;border-radius:4px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.45);background:var(--chip)}
.gitem b{font-size:13px;font-weight:650}
.gitem small{font-size:12px;color:var(--muted);margin-top:-4px}
.gitem small.own{color:var(--accent)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:110px 36px 0}
.empty .ic{width:72px;height:72px;border-radius:36px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.empty h2{margin:0;font-size:20px;font-weight:750}
.empty p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
/* ---------- Bibliothek: Regal ---------- */
.lsw{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--chip);margin-left:auto}
.lsw button{height:26px!important;padding:0 10px!important;border-radius:7px!important;font-size:12px;font-weight:650;color:var(--muted)}
.lsw button.on{background:var(--pill);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lbar{position:sticky;top:0;z-index:5;padding:8px 0 8px;background:var(--bg);box-shadow:0 8px 14px -8px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px}
.lchips,.ljump{display:flex;gap:6px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.lchips::-webkit-scrollbar,.ljump::-webkit-scrollbar{display:none}
.lchip{flex:0 0 auto;height:30px;padding:0 12px;border-radius:15px;background:var(--chip);font-size:12.5px;font-weight:650;color:var(--text2);white-space:nowrap}
.lchip.uc{background:transparent;box-shadow:inset 0 0 0 1.5px var(--chip2)}
.lchip.on{background:var(--accent);color:var(--onaccent);box-shadow:none}
.lchip.add{background:none;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.lchips .sep{flex:0 0 1px;background:var(--line);margin:4px}
.lgsw{display:flex;align-items:center;gap:2px;padding:0 16px;font-size:12px;color:var(--muted);white-space:nowrap}
.lgsw span{margin-right:4px}
.lgsw button{height:26px;padding:0 9px;white-space:nowrap;border-radius:12px;font-size:12px;font-weight:650;color:var(--muted)}
.lgsw button.on{background:var(--chip);color:var(--text)}
.ljump button{flex:0 0 auto;height:24px;min-width:34px;padding:0 8px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--line);font-size:11.5px;font-weight:700;color:var(--text2)}
.lwall{padding:2px 0 30px;min-height:100%;background:linear-gradient(180deg,var(--wall1),var(--wall2))}
.lshelf{margin:16px 0 0}
.lshelf .lab{display:flex;align-items:baseline;gap:8px;padding:0 20px 8px;font-size:13px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lshelf .lab span{font-weight:600;letter-spacing:0;text-transform:none;font-size:12px}
.lrow{position:relative;height:214px;padding:0 16px;display:flex;align-items:flex-end;gap:1px;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 22%),linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 6%,rgba(0,0,0,0) 94%,rgba(0,0,0,.18))}
.lboard + .lrow{margin-top:14px}
.lboard{position:relative;height:22px;margin:0 6px;border-radius:2px;background:linear-gradient(180deg,var(--woodtop) 0,var(--wood1) 7px,var(--wood2) 8px,var(--wood3) 100%);box-shadow:0 10px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.lboard::before{content:"";position:absolute;inset:8px 0 0;opacity:.18;background:repeating-linear-gradient(90deg,rgba(0,0,0,.25) 0 1px,transparent 1px 7px,rgba(255,255,255,.12) 7px 8px,transparent 8px 19px)}
.lsp{position:relative;flex:0 0 auto;width:var(--sw);height:var(--sh);border-radius:2px 2px 0 0;transform-origin:50% 100%;padding:0;

.go{margin-top:14px;width:100%;height:46px;border-radius:23px;border:0;background:#1B1B1D;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.go:disabled{background:#CFCBC2;cursor:not-allowed}
.prog{margin-top:12px;display:none}
.prog.on{display:block}
.prog .track{background:#ECEAE5;height:6px;border-radius:3px}
.prog .track div{background:#1B1B1D;height:100%;width:0}
.prog small{display:block;margin-top:6px;font-size:12px;color:#5E5E66}
.ilist{display:flex;flex-direction:column;gap:14px}
.imag b{font-size:14px}
.irow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #F0EEE9}
.irow img{width:38px;height:54px;object-fit:cover;border-radius:3px;background:#ddd;flex:0 0 38px}
.irow div{flex:1;display:flex;flex-direction:column;gap:2px;font-size:13px}
.irow small{color:#6B6B73;font-size:12px}
.del{border:1px solid #E2DFD8;background:#fff;border-radius:8px;height:32px;padding:0 10px;font-size:12px;font-weight:650;color:#B3261E;cursor:pointer}
.pempty{font-size:13px;color:#6B6B73;line-height:1.5}
.ck{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px}
.ck input[type=checkbox]{width:20px;height:20px;accent-color:#1B1B1D}
.ck input[type=color]{width:44px;height:30px;border:1px solid #D9D6CF;border-radius:8px;padding:2px;background:#fff}
.ck input[type=text]{width:150px;height:34px;border-radius:8px;border:1px solid #D9D6CF;padding:0 8px;font:inherit;font-size:13px}
.ghost{border:1px solid #D9D6CF;background:#fff;border-radius:10px;height:38px;padding:0 14px;font-size:13px;font-weight:650;cursor:pointer;color:#1B1B1D}
.ghost.red{color:#B3261E}
.prow2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.store{font-size:12px;color:#6B6B73;margin-top:10px}
.help{font-size:11.5px;line-height:1.4;color:#6B6B73;margin-top:-6px;margin-bottom:12px}
.pf textarea{min-height:76px;border-radius:10px;border:1px solid #D9D6CF;background:#FAFAF8;font:inherit;font-size:14px;padding:8px 10px;color:#1B1B1D;width:100%;resize:vertical}
.pf textarea:focus{outline:2px solid #1B1B1D;outline-offset:0;border-color:transparent}
details.ed{border:1px solid #ECEAE5;border-radius:12px;padding:0 12px;margin:6px 0 4px}
details.ed summary{cursor:pointer;padding:9px 0;font-size:13px;font-weight:650;color:#1B1B1D}
details.ed[open]{padding-bottom:12px}
.imgpick{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.imgpick .ghost{padding:0 12px;white-space:nowrap}
.imgpick .pv{width:56px;height:56px;border-radius:10px;background:#F1EFEA;border:1px solid #E2DFD8;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:11px;color:#8A8A92;flex:0 0 56px}
.imgpick .pv.wide{width:110px;flex-basis:110px;height:40px;border-radius:8px}
.imgpick .pv.tall{width:42px;flex-basis:42px;height:60px}
.imgpick .pv img{width:100%;height:100%;object-fit:contain;display:block}
.imgpick label.ghost{display:inline-flex;align-items:center}
.adblock{padding:14px 0;border-bottom:1px solid #F0EEE9}
.adblock:last-child{border-bottom:0}
.adblock b{display:block;font-size:14px;margin-bottom:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.swatch{height:34px;border-radius:17px;border:1px solid #D9D6CF;padding:0 12px 0 5px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#1B1B1D}
.swatch i{width:24px;height:24px;border-radius:12px;border:1px solid rgba(0,0,0,.15);display:block;position:relative;overflow:hidden}
.swatch i::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-top-left-radius:11px;background:var(--sw)}
.go.small{height:38px;font-size:13px;margin-top:4px}

body.app .panel{display:none}
body.full{background:var(--bg)}
body.full .stage{padding:0;height:100vh;height:100dvh}
body.full .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
body.full .screen{width:100vw;height:100vh;height:100dvh;border-radius:0}
body.full .hdr{padding-top:calc(14px + env(safe-area-inset-top))}
body.full .rtop,body.full .lmtop{padding-top:calc(8px + env(safe-area-inset-top));height:auto;min-height:64px}
body.full .tabs{height:calc(50px + max(env(safe-area-inset-bottom) - 12px, 4px));padding-bottom:max(env(safe-area-inset-bottom) - 12px, 4px)}
body.full .page{bottom:calc(50px + max(env(safe-area-inset-bottom) - 12px, 4px))}
body.full .npanel{top:calc(68px + env(safe-area-inset-top));bottom:calc(58px + max(env(safe-area-inset-bottom) - 12px, 4px))}
body.full .rbottom{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
body.full .lmplay,body.full .lmchfoot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
body.full .sheet{padding-bottom:calc(28px + env(safe-area-inset-bottom))}

  while (i < list.length) { var j = i; while (j + 1 < list.length && list[j + 1] === list[j] + 1) j++; out.push(j > i ? list[i] + '–' + list[j] : String(list[i])); i = j + 1; }
  return out.join(', ');
}
function parsePages(str, max) {
  var set = {};
  String(str || '').split(/[,;\s]+/).forEach(function (part) {
    var m = part.match(/^(\d+)\s*[-–]\s*(\d+)$/);
    if (m) { var a = Number(m[1]), b = Number(m[2]); if (a > b) { var t = a; a = b; b = t; } for (var n = a; n <= b && n - a < 500; n++) set[n] = 1; }
    else if (/^\d+$/.test(part)) set[Number(part)] = 1;
  });
  var list = Object.keys(set).map(Number).filter(function (n) { return n >= 1 && n <= max; }).sort(function (a, b) { return a - b; });
  if (!list.length) for (var k = 1; k <= Math.min(6, max); k++) list.push(k);
  return list;
}
function samplePagesOf(it) {
  if (it.samplePages && it.samplePages.length) return it.samplePages.filter(function (n) { return n <= it.pageCount; });
  var out = []; for (var k = 1; k <= Math.min(it.freePages || 6, it.pageCount); k++) out.push(k); return out;
}
function resizeImage(file, maxW, type) {
  return new Promise(function (res, rej) {
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () {
      var sc = Math.min(1, maxW / img.naturalWidth);
      var c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      var x = c.getContext('2d');
      if (type !== 'image/png') { x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, c.width, c.height); }
      x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(function (bl) { res(bl); }, type || 'image/jpeg', 0.88);
    };
    img.onerror = function () { URL.revokeObjectURL(u); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src = u;

}

/* Banner-Rotation */
var BR = { t: 0, el: null, n: 0, paused: false, rt: 0 };
function setupBanner() {
  clearTimeout(BR.t);
  var tr = $('#btrack'); BR.el = tr;
  if (!tr) return;
  var sl = bannerSlides(); BR.n = sl.length;
  tr.scrollLeft = S.bIndex * tr.clientWidth;
  var showDots = function () { $$('#bdots span').forEach(function (d, i) { d.classList.toggle('on', i === S.bIndex); }); };
  var playCur = function () {
    $$('video', tr).forEach(function (v, i) {
      if (i === S.bIndex) { try { v.currentTime = 0; } catch (e) {} var pr = v.play(); if (pr && pr.catch) pr.catch(function () {}); }
      else { try { v.pause(); } catch (e) {} }
    });
  };
  var schedule = function () {
    clearTimeout(BR.t);
    if (BR.n < 2 || BR.paused) return;
    var cur = sl[S.bIndex], v = cur && cur.kind === 'video' ? tr.children[S.bIndex].querySelector('video') : null;
    var secs = Math.max(2, Number(S.cfg.bannerSec) || 6);
    if (v) {
      v.onended = function () { next(); };
      var d = isFinite(v.duration) && v.duration > 0 ? v.duration : 30;
      BR.t = setTimeout(next, Math.min(60, d + 1) * 1000);   // Sicherheitsnetz, falls "ended" nicht kommt
    } else BR.t = setTimeout(next, secs * 1000);
  };
  var next = function () {
    if (!BR.el || !document.body.contains(tr)) return;
    S.bIndex = (S.bIndex + 1) % BR.n;
    tr.scrollTo({ left: S.bIndex * tr.clientWidth, behavior: 'smooth' });
  };
  tr.addEventListener('scroll', function () {
    clearTimeout(BR.rt);
    BR.rt = setTimeout(function () {
      var i = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
      i = Math.max(0, Math.min(BR.n - 1, i));
      if (i !== S.bIndex || !tr.dataset.started) { S.bIndex = i; tr.dataset.started = '1'; showDots(); playCur(); }
      schedule();
    }, 140);
  }, { passive: true });
  tr.addEventListener('pointerdown', function () { BR.paused = true; clearTimeout(BR.t); }, { passive: true });
  tr.addEventListener('pointerup', function () { BR.paused = false; schedule(); }, { passive: true });
  tr.addEventListener('pointercancel', function () { BR.paused = false; schedule(); }, { passive: true });
  tr.dataset.started = '1'; showDots(); playCur(); schedule();
}

function textFromItems(items, vp) {

    var last = lines[lines.length - 1];

    if (cur && cur.replace(/[^A-Za-zÄÖÜäöüß]/g, '').length >= 3) { paras.push(cur); boxes.push(cb); }

      cb = [Math.min(cb[0], l.b[0]), Math.max(cb[1], l.b[1]), Math.min(cb[2], l.b[2]), Math.max(cb[3], l.b[3])];
    }

    var best = -1, bd = 1;

      if (!/^[a-zäöüß]/.test(p)) return;

function guessFromName(name) {
  var base = name.replace(/\.pdf$/i, '');
  var g = { month: null, year: null, title: '' };
  var m = base.match(/(?:^|[^0-9])(0?[1-9]|1[0-2])[-_.\s]+(20\d{2}|\d{2})(?![0-9])/);
  if (m) {
    g.month = Number(m[1]);
    g.year = m[2].length === 2 ? 2000 + Number(m[2]) : Number(m[2]);
    base = base.slice(0, m.index + (m[0].match(/^[^0-9]/) ? 1 : 0));
  }
  if (/^[0-9a-f]{8,}/i.test(base.replace(/[^0-9a-z]/gi, '')) && /\d/.test(base)) { g.title = ''; return g; }
  g.title = base.replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim().split(' ').map(function (w) {
    if (!w) return w;
    return w.length <= 2 ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1);
  }).join(' ');
  return g;
}

async function saveNews(key, patch) {
  var base = S.news.filter(function (n) { return n.key === key; })[0] || {};
  var cur = Object.assign({}, base, patch);
  ['id', 'key', 'imgURL'].forEach(function (k) { delete cur[k]; });
  Object.keys(cur).forEach(function (k) { if (cur[k] === null || cur[k] === undefined) delete cur[k]; });
  await DB.put('ads', cur, key);
  await loadData(); rerender(); renderPanel();
}
async function saveAd(key, patch) {
  var base = key.indexOf('cat:') === 0 ? (S.catRec[key.slice(4)] || {}) : (S.ads[key] || {});
  var cur = Object.assign({}, base, patch);
  delete cur.id;
  Object.keys(cur).forEach(function (k) { if (cur[k] === null || cur[k] === undefined) delete cur[k]; });
  await DB.put('ads', cur, key);
  await loadData(); rerender(); renderPanel();
}

function bindPanel() {
  var dz = $('#dz', panel), fin = $('#fin', panel);
  dz.addEventListener('click', function () { if (!U.busy) fin.click(); });
  dz.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fin.click(); } });
  ['dragenter', 'dragover'].forEach(function (t) { dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.add('hover'); }); });
  ['dragleave', 'drop'].forEach(function (t) { dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.remove('hover'); }); });
  dz.addEventListener('drop', function (e) { var f = e.dataTransfer.files[0]; if (f) pickFile(f); });
  fin.addEventListener('click', function (e) { e.stopPropagation(); });
  fin.addEventListener('change', function () { if (fin.files[0]) pickFile(fin.files[0]); });
  $('#fMag', panel).addEventListener('change', syncNewMag);
  $('#fGo', panel).addEventListener('click', processUpload);

  /* Bilder wählen / entfernen */
  $$('input[data-img]', panel).forEach(function (inp) {
    inp.addEventListener('change', async function () {
      var f = inp.files[0]; if (!f) return;
      var id = inp.getAttribute('data-img');
      try {
        if (id === 'newlogo') {
          var nl = await logoFrom(f); U.newLogo = nl.blob; U.newLogoAspect = nl.aspect; U.newLogoBg = nl.bg;
          if (U.newLogoURL) URL.revokeObjectURL(U.newLogoURL);
          U.newLogoURL = URL.createObjectURL(U.newLogo);
          var pv = inp.closest('.imgpick').querySelector('.pv'); pv.innerHTML = '<img src="' + U.newLogoURL + '" alt="">';
        } else if (id.indexOf('logo:') === 0) {
          var m = magById(id.slice(5));
          var lg = await logoFrom(f); m.logo = lg.blob; m.logoAspect = lg.aspect; m.logoBg = lg.bg;
          await DB.put('mags', m); await loadData(); rerender(); renderPanel();
        } else if (id.indexOf('news:') === 0) {
          await saveNews(id, { img: await resizeImage(f, 1200, 'image/jpeg') });
        } else if (id.indexOf('cat:') === 0) {
          await saveAd(id, { img: await resizeImage(f, 480, 'image/jpeg') });
        } else if (id === 'brand') {
          await saveAd('brand', { img: await resizeImage(f, 660, 'image/png') });
        } else {
          var w = id === 'banner' ? 1200 : id === 'native' ? 400 : 1400;
          await saveAd(id, { img: await resizeImage(f, w, 'image/jpeg') });
        }
      } catch (err) { alert(err.message || 'Bild konnte nicht gespeichert werden.'); }
    });
  });
  $$('[data-imgrm]', panel).forEach(function (b) {
    b.addEventListener('click', async function () {
      var id = b.getAttribute('data-imgrm');
      if (id === 'newlogo') { U.newLogo = null; if (U.newLogoURL) URL.revokeObjectURL(U.newLogoURL); U.newLogoURL = ''; renderPanel(); return; }
      if (id.indexOf('logo:') === 0) { var m = magById(id.slice(5)); delete m.logo; delete m.logoAspect; delete m.logoBg; await DB.put('mags', m); await loadData(); rerender(); renderPanel(); return; }
      if (id.indexOf('news:') === 0) { await saveNews(id, { img: null }); return; }
      await saveAd(id, { img: null });
    });
  });
  $$('[data-dev]', panel).forEach(function (b) {
    b.addEventListener('click', function () { S.preview = b.getAttribute('data-dev'); try { localStorage.setItem('kioskPreview', S.preview); } catch (e) {} fit(); rerender(); renderPanel(); });
  });

async function pickFile(f) {
  if (U.busy) return;
  if (!/\.pdf$/i.test(f.name) && f.type !== 'application/pdf') { alert('Bitte eine PDF-Datei wählen.'); return; }
  U.file = f;
  U.buf = await f.arrayBuffer();
  try {
    var pdf = await pdfjsLib.getDocument({ data: U.buf.slice(0) }).promise;
    U.pages = pdf.numPages;
    await pdf.destroy();
  } catch (err) {
    alert('Die PDF-Datei konnte nicht gelesen werden.');
    U.file = null; U.buf = null; return;
  }
  U.guess = guessFromName(f.name);
  U.formSet = false;
  restoreForm();
}
function restoreForm() {
  var f = U.file;
  var info = $('#finfo', panel);
  info.style.display = 'flex';
  info.innerHTML = '<b>' + esc(f.name) + '</b><span>· ' + U.pages + ' Seiten · ' + (f.size / 1048576).toFixed(1) + ' MB</span>';
  $('#form', panel).style.display = 'block';
  if (U.form) {
    Object.keys(U.form).forEach(function (id) { var el = $('#' + id, panel); if (el) el.value = U.form[id]; });
    syncNewMag(); return;
  }
  var g = U.guess;
  var sel = $('#fMag', panel);
  var match = S.mags.filter(function (m) { return g.title && slug(m.name) === slug(g.title); })[0];
  sel.value = match ? match.id : (S.mags.length && !g.title ? S.mags[0].id : '__new');
  $('#fName', panel).value = match ? '' : g.title;
  $('#fColor', panel).value = PALETTE[S.mags.length % PALETTE.length];

async function processUpload() {
  if (U.busy || !U.buf) return;
  var selV = $('#fMag', panel).value;
  var month = Number($('#fMonth', panel).value), year = Number($('#fYear', panel).value);
  var price = $('#fPrice', panel).value.trim() || '5,99 €';
  var lim = Number($('#fLim', panel).value);
  var sampleStr = $('#fSample', panel).value;
  var teaser = $('#fTeaser', panel).value.trim();
  if (!year || year < 1990) { alert('Bitte ein gültiges Jahr eingeben.'); return; }
  var mag;
  if (selV === '__new') {
    var name = $('#fName', panel).value.trim();
    if (!name) { alert('Bitte einen Namen für das Magazin eingeben.'); $('#fName', panel).focus(); return; }
    var id = slug(name), n2 = 2;
    while (magById(id)) id = slug(name) + n2++;
    mag = { id: id, name: name, cat: $('#fCat', panel).value.trim(), color: $('#fColor', panel).value, aboMonth: $('#fAm', panel).value.trim(), aboYear: $('#fAy', panel).value.trim(), created: Date.now() };
    if (U.newLogo) { mag.logo = U.newLogo; mag.logoAspect = U.newLogoAspect || 1; mag.logoBg = U.newLogoBg || '#FFFFFF'; }
  } else mag = magById(selV);
  var issueId = mag.id + '-' + year + '-' + pad(month);
  if (issueById(issueId) && !confirm('Diese Ausgabe (' + mag.name + ' · ' + MONTHS[month - 1] + ' ' + year + ') gibt es schon. Ersetzen?')) return;

  U.busy = true;
  var go = $('#fGo', panel), prog = $('#prog', panel), bar = $('#pbar', panel), txt = $('#ptxt', panel);
  go.disabled = true; go.textContent = 'Wird verarbeitet …';
  prog.classList.add('on');
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    await DB.delPages(issueId);
    var pdf = await pdfjsLib.getDocument({ data: U.buf.slice(0) }).promise;
    var N = lim ? Math.min(lim, pdf.numPages) : pdf.numPages;
    var coverBlob = null, aspect = 1.414;
    var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d');
    for (var p = 1; p <= N; p++) {
      txt.textContent = 'Seite ' + p + ' von ' + N + ' wird aufbereitet …';
      var page = await pdf.getPage(p);
      var vp1 = page.getViewport({ scale: 1 });
      var vp = page.getViewport({ scale: 1100 / vp1.width });
      canvas.width = Math.round(vp.width); canvas.height = Math.round(vp.height);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      var blob = await new Promise(function (r) { canvas.toBlob(r, 'image/jpeg', 0.82); });
      await DB.put('pages', blob, issueId + ':' + pad3(p));
      var tcv = document.createElement('canvas'); tcv.width = 160; tcv.height = Math.round(160 * canvas.height / canvas.width);
      tcv.getContext('2d').drawImage(canvas, 0, 0, tcv.width, tcv.height);
      await DB.put('pages', await new Promise(function (r) { tcv.toBlob(r, 'image/jpeg', 0.75); }), issueId + ':t' + pad3(p));
      if (p === 1) {
        aspect = canvas.height / canvas.width;
        var c2 = document.createElement('canvas');
        c2.width = 460; c2.height = Math.round(460 * aspect);
        c2.getContext('2d').drawImage(canvas, 0, 0, c2.width, c2.height);
        coverBlob = await new Promise(function (r) { c2.toBlob(r, 'image/jpeg', 0.86); });
      }
      page.cleanup();
      bar.style.width = (p / N * 100) + '%';
    }
    txt.textContent = 'Text für Lesemodus und Vorlesen wird übernommen …';
    var texts = await extractTexts(pdf, N);
    await DB.put('texts', texts, issueId);
    var total = pdf.numPages;
    await pdf.destroy();
    var sample = parsePages(sampleStr, N);
    await DB.put('mags', mag);
    await DB.put('issues', { id: issueId, magId: mag.id, year: year, month: month, price: price, samplePages: sample, freePages: sample.length, teaser: teaser, pageCount: N, totalPages: total, aspect: aspect, cover: coverBlob, thumbs: 1, added: Date.now() });
    await loadData();
    S.magId = mag.id; S.year = year; S.view = 'swipe';
    S.kIndex = Math.max(0, issuesOf(mag.id, year).findIndex(function (x) { return x.id === issueId; }));
    if (S.screen !== 'kiosk') { R = null; S.screen = 'kiosk'; }
    S.kIn = true;
    if (U.newLogoURL) URL.revokeObjectURL(U.newLogoURL);
    U = { file: null, buf: null, pages: 0, busy: false };
    render(); renderPanel(); panel.scrollTop = 0;
    toast(mag.name + ' · ' + MONTHS[month - 1] + ' ' + year + ' ist im Kiosk');
  } catch (err) {
    console.error(err);
    U.busy = false;
    go.disabled = false; go.textContent = 'Hochladen & verarbeiten';
    txt.textContent = 'Fehler: ' + (err && err.name === 'QuotaExceededError' ? 'Der Browser-Speicher ist voll. Lösche alte Ausgaben oder übernimm weniger Seiten.' : (err && err.message || err));
  }
}

/* ================= Größe & Start ================= */
function fit() {
  var ph = document.getElementById('phone');
  var wasTab = document.body.classList.contains('tablet');
  if (!IS_ADMIN && (window.Capacitor || window.innerWidth <= 600 || window.innerWidth >= 700 && 'ontouchstart' in window || window.matchMedia('(display-mode: standalone)').matches)) {
    ZOOM = 1; ph.style.zoom = 1; document.body.classList.add('full');
    document.body.classList.toggle('tablet', Math.min(window.innerWidth, window.innerHeight) >= 600);
    document.body.classList.toggle('land', Math.min(window.innerWidth, window.innerHeight) >= 600 && window.innerWidth > window.innerHeight);
  } else {
    document.body.classList.remove('full');
    var ipad = IS_ADMIN && S.preview === 'ipad';
    document.body.classList.toggle('tablet', ipad);
    ph.classList.toggle('ipad', ipad);
    var pw = ipad ? 844 : 414, phh = ipad ? 1204 : 868, side = IS_ADMIN ? 400 + 44 + 48 : 48;
    ZOOM = window.innerWidth <= 920 ? Math.min(1, (window.innerWidth - 24) / pw) : Math.min(1, (window.innerHeight - 40) / phh, (window.innerWidth - side) / pw);
    ph.style.zoom = ZOOM;
  }
  if (wasTab !== document.body.classList.contains('tablet') && typeof rerender === 'function' && app.innerHTML) rerender();
}
window.addEventListener('resize', fit);

async function start() {
  fit();
  if (IS_ADMIN && window.pdfjsLib) {
    try {
      var bytes = Uint8Array.from(atob(PDF_WORKER_B64), function (c) { return c.charCodeAt(0); });
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' }));
    } catch (e) { console.warn('PDF-Worker', e); }
  }
  loadPrefs();
  try { await DB.open(); await loadData(); }
  catch (e) {
    applyTheme();
    app.innerHTML = '<div class="empty"><div class="ic">' + ICON.book + '</div><h2>' + (e.config ? 'Noch nicht eingerichtet' : 'Keine Verbindung') + '</h2><p>' + (e.config ? 'In config.js fehlen die Supabase-Zugangsdaten.' : 'Der Kiosk konnte nicht geladen werden. Prüfe deine Internetverbindung und versuche es erneut.') + '</p>' + (e.config ? '' : '<button class="btn pbtn" style="flex:none;padding:0 24px;margin-top:8px" onclick="location.reload()">Erneut versuchen</button>') + '</div>';
    if (IS_ADMIN) renderPanel();
    return;
  }
  render(); if (IS_ADMIN) renderPanel();
  if (!IS_ADMIN && !window.Capacitor && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
  var capApp = !IS_ADMIN ? capPlugin('App') : null;
  if (capApp) {
    capApp.addListener('appStateChange', async function (st) { if (st.isActive && S.screen === 'kiosk' && !S.sheet && !S.menu) { try { await loadData(); rerender(); } catch (e) {} } });
    capApp.addListener('backButton', function () {
      if (S.sheet) { S.sheet = null; rerender(); } else if (S.menu) { S.menu = false; rerender(); } else if (S.screen === 'lesen') closeLM(); else if (S.screen === 'reader') closeReader(); else if (S.screen === 'library') { S.screen = 'kiosk'; render(); } else capApp.exitApp();
    });
  }
  if (!IS_ADMIN) document.addEventListener('visibilitychange', async function () {
    if (document.visibilityState === 'visible' && S.screen === 'kiosk' && !S.sheet && !S.menu) { try { await loadData(); rerender(); } catch (e) {} }
  });
}
start();
})();
</script>
